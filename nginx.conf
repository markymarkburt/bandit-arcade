server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets, never cache HTML.
    location ~* \.(css|js|svg|png|jpg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
