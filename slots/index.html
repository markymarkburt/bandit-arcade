<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bandit Slots · Bandit Arcade</title>
  <meta name="description" content="Bandit Slots — a one-armed bandit. Pull the lever, take the loot." />
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="brand-mark">🥷</span>BANDIT ARCADE</span>
    <nav>
      <a href="/">Games</a>
      <a href="/slots/" class="active">Slots</a>
      <a href="/holdem/">Hold'em</a>
    </nav>
  </header>

  <main class="page">
    <div class="machine panel">
      <h1 class="game-title">BANDIT&nbsp;SLOTS</h1>
      <p class="tagline">One-armed, zero mercy. Pull the lever, take the loot.</p>

      <section class="reels" aria-label="Slot reels">
        <div class="reel" id="reel-0"><span class="symbol">🥷</span></div>
        <div class="reel" id="reel-1"><span class="symbol">💰</span></div>
        <div class="reel" id="reel-2"><span class="symbol">⭐</span></div>
      </section>

      <p class="message" id="message">Place your bet and pull the lever.</p>

      <section class="controls">
        <div class="bet">
          <button id="bet-down" class="chip-btn" aria-label="Decrease bet">−</button>
          <div class="bet-display">
            <span class="label">BET</span>
            <span id="bet-amount">10</span>
          </div>
          <button id="bet-up" class="chip-btn" aria-label="Increase bet">+</button>
        </div>

        <button id="lever" class="btn btn-gold lever-btn">PULL</button>
      </section>

      <section class="stats">
        <div class="stat">
          <span class="label">CREDITS</span>
          <span id="credits">100</span>
        </div>
        <div class="stat">
          <span class="label">LAST WIN</span>
          <span id="last-win">0</span>
        </div>
        <div class="stat">
          <span class="label">SPINS</span>
          <span id="spins">0</span>
        </div>
      </section>

      <details class="paytable-wrap">
        <summary>Paytable</summary>
        <table class="paytable" id="paytable"></table>
      </details>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
